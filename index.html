<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GN d3v · collettivo di sviluppatori</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-anim="full">
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="scroll-bar" id="scrollbar"></div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="content.jsx"></script>
  <script type="text/babel" src="sections.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "animStyle": "full",
      "scanlines": true,
      "accent": "#5fdc8b"
    }/*EDITMODE-END*/;

    function StatusBar({ t, lang, setLang, time }) {
      return (
        <div className="statusbar">
          <div className="group">
            <span className="dot"></span>
            <span className="status-text">{t.statusbar.status}</span>
          </div>
          <span className="sep hide-mobile">│</span>
          <span className="hide-mobile">{t.statusbar.version}</span>
          <span className="sep hide-mobile">│</span>
          <span className="hide-mobile">{t.statusbar.uptime}</span>
          <div className="right">
            <span className="hide-mobile" style={{ fontVariantNumeric: 'tabular-nums' }}>{time}</span>
            <div className="lang-switch">
              <button className={lang === "it" ? "active" : ""} onClick={() => setLang("it")}>IT</button>
              <button className={lang === "en" ? "active" : ""} onClick={() => setLang("en")}>EN</button>
            </div>
          </div>
        </div>
      );
    }

    function SideRail({ t, active }) {
      return (
        <nav className="siderail">
          {t.nav.map((n) => (
            <a key={n.id} href={`#${n.id}`} className={active === n.id ? "active" : ""}>
              <span>{n.label}</span>
            </a>
          ))}
        </nav>
      );
    }

    function Footer({ t }) {
      return (
        <footer>
          <div>{t.footer.left}</div>
          <div>{t.footer.right} <span className="heart">{t.footer.heart}</span></div>
        </footer>
      );
    }

    function Konami({ onClose }) {
      return (
        <div className="konami" onClick={onClose}>
          <pre>{`
   ▄▄ • ███▄    █ ▓█████▄  ██▓███   ██▒   █▓
  ▐█ ▀ ▪ ██ ▀█   █ ▒██▀ ██▌▓██░  ██▒▓██░   █▒
  ▄█ ▀█▄ ▓██  ▀█ ██▒░██   █▌▓██░ ██▓▒ ▓██  █▒░
  ▐█▄▪▐█ ▓██▒  ▐▌██▒░▓█▄   ▌▒██▄█▓▒ ▒  ▒██ █░░
  ·▀▀▀▀  ▒██░   ▓██░░▒████▓ ▒██▒ ░  ░   ▒▀█░
                                          ░ ▐░
        secret unlocked · you found us.
`}</pre>
          <div className="hint">// click anywhere to close</div>
        </div>
      );
    }

    function App() {
      const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const [lang, setLang] = useState("it");
      const [active, setActive] = useState("hero");
      const [time, setTime] = useState("");
      const [konami, setKonami] = useState(false);

      const t = CONTENT[lang];

      useReveal();

      // animation style on body
      useEffect(() => {
        document.body.dataset.anim = tw.animStyle;
        document.documentElement.style.setProperty("--green", tw.accent);
      }, [tw.animStyle, tw.accent]);

      // scanlines visibility
      useEffect(() => {
        document.querySelector(".scanlines").style.display = tw.scanlines ? "block" : "none";
      }, [tw.scanlines]);

      // clock
      useEffect(() => {
        const update = () => {
          const d = new Date();
          const hh = String(d.getHours()).padStart(2, "0");
          const mm = String(d.getMinutes()).padStart(2, "0");
          const ss = String(d.getSeconds()).padStart(2, "0");
          setTime(`${hh}:${mm}:${ss}`);
        };
        update();
        const id = setInterval(update, 1000);
        return () => clearInterval(id);
      }, []);

      // scroll progress + active section
      useEffect(() => {
        const onScroll = () => {
          const h = document.documentElement;
          const max = h.scrollHeight - h.clientHeight;
          const p = max > 0 ? (h.scrollTop / max) * 100 : 0;
          document.getElementById("scrollbar").style.width = p + "%";
          // active section
          const ids = t.nav.map((n) => n.id);
          let cur = ids[0];
          for (const id of ids) {
            const el = document.getElementById(id);
            if (!el) continue;
            const r = el.getBoundingClientRect();
            if (r.top < window.innerHeight * 0.4) cur = id;
          }
          setActive(cur);
        };
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, [lang]);

      // konami code: ↑ ↑ ↓ ↓ ← → ← → b a
      useEffect(() => {
        const seq = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown","ArrowLeft","ArrowRight","ArrowLeft","ArrowRight","b","a"];
        let idx = 0;
        const onKey = (e) => {
          const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
          if (k === seq[idx]) {
            idx++;
            if (idx === seq.length) { setKonami(true); idx = 0; }
          } else {
            idx = (k === seq[0]) ? 1 : 0;
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      return (
        <>
          <StatusBar t={t} lang={lang} setLang={setLang} time={time} />
          <SideRail t={t} active={active} />
          <main>
            <Hero t={t} key={"hero-" + lang} />
            <Manifesto t={t} key={"man-" + lang} />
            <Services t={t} key={"svc-" + lang} />
            <Projects t={t} key={"prj-" + lang} />
            <Team t={t} key={"tm-" + lang} />
            <Contact t={t} key={"ct-" + lang} />
            <Footer t={t} />
          </main>
          {konami && <Konami onClose={() => setKonami(false)} />}

          <TweaksPanel>
            <TweakSection label="Animations" />
            <TweakRadio
              label="Style"
              value={tw.animStyle}
              options={["off", "subtle", "full"]}
              onChange={(v) => setTweak("animStyle", v)}
            />
            <TweakToggle
              label="CRT scanlines"
              value={tw.scanlines}
              onChange={(v) => setTweak("scanlines", v)}
            />
            <TweakSection label="Theme" />
            <TweakColor
              label="Accent"
              value={tw.accent}
              options={["#5fdc8b", "#f5b454", "#6bb8ff", "#ff7eb6"]}
              onChange={(v) => setTweak("accent", v)}
            />
          </TweaksPanel>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
